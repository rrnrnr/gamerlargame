<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GAMERLAR Game</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#111;
    color:white;
    overflow:hidden;
}

h1{
    text-align:center;
    margin:10px;
}

.score, .time{
    position:absolute;
    top:10px;
    font-size:24px;
    background:rgba(0,0,0,0.5);
    padding:10px 15px;
    border-radius:10px;
}

.score{ left:10px; }
.time{ right:10px; }

.target{
    position:absolute;
    width:110px;
    height:110px;
    cursor:pointer;
    transition:0.2s;
}

.start, .gameover{
    position:absolute;
    width:100%;
    height:100%;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
}

button{
    padding:15px 30px;
    font-size:20px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    background:#00ff88;
}
</style>
</head>

<body>

<!-- START -->
<div class="start" id="startScreen">
    <h1>gamerlar game</h1>
    <button onclick="startGame()">START</button>
</div>

<!-- UI -->
<div class="score">Score: <span id="score">0</span></div>
<div class="time">Time: <span id="time">9999</span></div>

<!-- GAME OVER -->
<div class="gameover" id="gameOver" style="display:none;">
    <h1>Game Over</h1>
    <button onclick="location.reload()">Restart</button>
</div>

<!-- IMAGES -->
<img src="amr.jpg" class="target" data-sound="dman">
<img src="drm.jpg" class="target" data-sound="amrman">
<img src="nova.jpg" class="target" data-sound="axxx">
<img src="mores.jpg" class="target" data-sound="oka">

<script>

let score = 0;
let combo = 0;

const targets = document.querySelectorAll(".target");

function startGame(){
    document.getElementById("startScreen").style.display = "none";

    moveAll();

    timer = setInterval(() => {
        time--;
        document.getElementById("time").innerText = time;

        if(time <= 0){
            clearInterval(timer);
            endGame();
        }
    },1000);
}

targets.forEach(item => {
    item.addEventListener("click", function(){

        score++;
        combo++;

        document.getElementById("score").innerText = score;

        // SOUND
        let sound = this.getAttribute("data-sound");
        new Audio("sounds/" + sound + ".mp3").play();

        // bonus combo
        if(combo % 5 === 0){
            score += 3;
            document.getElementById("score").innerText = score;
        }

        moveRandom(this);
    });
});

function moveRandom(el){

    const maxX = window.innerWidth - 120;
    const maxY = window.innerHeight - 120;

    el.style.opacity = "0";

    setTimeout(() => {

        el.style.left = Math.random() * maxX + "px";
        el.style.top = Math.random() * maxY + "px";

        el.style.opacity = "1";

    },100);
}

function moveAll(){
    targets.forEach(t => {
        t.style.left = Math.random() * 300 + "px";
        t.style.top = Math.random() * 300 + "px";
    });
}

function endGame(){
    document.getElementById("gameOver").style.display = "flex";
}

</script>

</body>
</html>
